name: Cloud Backend Ops & DB Health Monitor

on:
  # Manual trigger with custom input parameters
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'development'
          - 'staging'
          - 'production'
      dry_run:
        description: 'Simulate operations without connecting to live database (Dry Run)'
        required: true
        default: false
        type: boolean
      override_email_to:
        description: 'Optional: Override notification recipient email'
        required: false
        default: ''
        type: string

  # Also runs on manual push to main/master if desired
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  id-token: write

jobs:
  run-backend-ops:
    name: Execute Backend Ops & Database Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Generate .env file from GitHub Secrets & Inputs
        run: |
          echo "Generating .env configuration file for runtime execution..."
          cat << 'EOF' > .env
          # Auto-generated .env for GitHub Actions Run
          APP_ENV=${{ github.event.inputs.environment || 'staging' }}
          APP_NAME=CloudOps-DB-Monitor
          DRY_RUN=${{ github.event.inputs.dry_run || 'false' }}

          # Cloud MySQL Database Credentials
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT || '3306' }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USE_SSL=${{ secrets.DB_USE_SSL || 'true' }}
          DB_CONNECT_TIMEOUT=15

          # SMTP Email Service Configuration
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS=${{ secrets.SMTP_USE_TLS || 'true' }}
          SMTP_USE_SSL=${{ secrets.SMTP_USE_SSL || 'false' }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM || secrets.SMTP_USER }}
          EMAIL_TO=${{ github.event.inputs.override_email_to != '' && github.event.inputs.override_email_to || secrets.EMAIL_TO }}
          EOF
          
          # Ensure sensitive permissions on generated .env
          chmod 600 .env
          echo "✅ .env generated successfully."

      - name: 🚀 Run Backend Ops & SMTP Report Dispatch
        env:
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          python -m src.main
